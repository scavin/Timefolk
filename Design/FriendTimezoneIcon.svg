<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS App Icon Drop Shadow -->
    <filter id="macAppShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Warm Glow Filter -->
    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Canvas Background Gradient: From Morning Dawn (Top-Left) to Twilight Evening (Bottom-Right) -->
    <linearGradient id="friendlyCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Canvas Inner Highlight / Stroke -->
    <linearGradient id="canvasHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Left Portal (Daytime / Morning Sun) -->
    <radialGradient id="daylightPortalGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </radialGradient>

    <!-- Right Portal (Nighttime / Starry Moon) -->
    <radialGradient id="nightPortalGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="80%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>

    <!-- Timezone Connecting Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="92" y="92" width="840" height="840" rx="200" ry="200" />
    </clipPath>

    <clipPath id="leftBubbleClip">
      <circle cx="395" cy="480" r="190" />
    </clipPath>

    <clipPath id="rightBubbleClip">
      <circle cx="635" cy="540" r="190" />
    </clipPath>
  </defs>

  <!-- ==================== macOS Squircle Base ==================== -->
  <g filter="url(#macAppShadow)">
    <rect x="92" y="92" width="840" height="840" rx="200" ry="200" fill="url(#friendlyCanvasBg)" />
    <rect x="92" y="92" width="840" height="840" rx="200" ry="200" fill="url(#canvasHighlight)" />
    <rect x="92.5" y="92.5" width="839" height="839" rx="199.5" ry="199.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />
  </g>

  <!-- ==================== Inner Content ==================== -->
  <g clip-path="url(#squircleClip)">

    <!-- Background Ambient Aura -->
    <circle cx="340" cy="440" r="260" fill="#F59E0B" opacity="0.12" filter="url(#warmGlow)" />
    <circle cx="680" cy="560" r="260" fill="#6366F1" opacity="0.15" filter="url(#warmGlow)" />

    <!-- Connecting Timezone Ribbon Bridge -->
    <path d="M 395 480 C 450 380, 580 640, 635 540" fill="none" stroke="url(#ribbonGrad)" stroke-width="12" stroke-linecap="round" opacity="0.75" />
    <path d="M 395 480 C 450 380, 580 640, 635 540" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 16" opacity="0.8" />

    <!-- ==================== RIGHT PORTAL: Nighttime Friend (Sleep / Moon) ==================== -->
    <g filter="url(#macAppShadow)">
      <!-- Outer Rim Ring -->
      <circle cx="635" cy="540" r="195" fill="none" stroke="#A5B4FC" stroke-opacity="0.3" stroke-width="4" />
      <circle cx="635" cy="540" r="190" fill="url(#nightPortalGrad)" />

      <!-- Clipped Night Scene -->
      <g clip-path="url(#rightBubbleClip)">
        <!-- Twinkling Stars -->
        <circle cx="560" cy="430" r="3" fill="#FFFFFF" opacity="0.9" />
        <circle cx="710" cy="440" r="2.5" fill="#E0E7FF" opacity="0.8" />
        <circle cx="740" cy="510" r="3" fill="#FFFFFF" opacity="0.85" />
        <circle cx="530" cy="520" r="2" fill="#E0E7FF" opacity="0.7" />
        <circle cx="580" cy="620" r="2.5" fill="#FFFFFF" opacity="0.75" />

        <!-- Distant Night Clouds -->
        <path d="M 520 660 Q 640 600 780 660 Z" fill="#1E1B4B" opacity="0.6" />

        <!-- Friendly Friend Silhouette (Sleeping / Resting Peaceful Avatar) -->
        <g transform="translate(635, 575)" opacity="0.95">
          <!-- Head / Hair -->
          <circle cx="0" cy="-40" r="46" fill="#F8FAFC" />
          <path d="M -46 -40 C -46 -80, 46 -80, 46 -40 C 46 -15, 20 0, 0 0 C -20 0, -46 -15, -46 -40 Z" fill="#475569" />
          <circle cx="0" cy="-35" r="38" fill="#F8FAFC" />
          <!-- Closed smiling eyes (sleeping peacefully) -->
          <path d="M -22 -35 Q -14 -28 -6 -35" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
          <path d="M 6 -35 Q 14 -28 22 -35" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
          <!-- Gentle smile -->
          <path d="M -8 -18 Q 0 -12 8 -18" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />
          <!-- Shoulders -->
          <path d="M -65 60 C -60 15, 60 15, 65 60 Z" fill="#6366F1" />
        </g>
      </g>

      <!-- Glass Highlight Edge -->
      <circle cx="635" cy="540" r="189" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" />

      <!-- Crescent Moon Status Badge (Night Indicator) -->
      <g transform="translate(745, 430)">
        <circle cx="0" cy="0" r="28" fill="#1E1B4B" stroke="#818CF8" stroke-width="2" />
        <!-- Crescent Moon -->
        <path d="M 6 -14 C -6 -14, -14 -6, -14 6 C -14 14, -8 20, 0 22 C -6 18, -8 10, -6 2 C -4 -6, 2 -12, 10 -13 C 8.7 -13.7, 7.3 -14, 6 -14 Z" fill="#FDE047" />
      </g>
    </g>

    <!-- ==================== LEFT PORTAL: Daytime Friend (Morning Sun / Greeting) ==================== -->
    <g filter="url(#macAppShadow)">
      <!-- Outer Rim Ring -->
      <circle cx="395" cy="480" r="195" fill="none" stroke="#FDE047" stroke-opacity="0.4" stroke-width="4" />
      <circle cx="395" cy="480" r="190" fill="url(#daylightPortalGrad)" />

      <!-- Clipped Day Scene -->
      <g clip-path="url(#leftBubbleClip)">
        <!-- Morning Sun Rays in background -->
        <g opacity="0.35">
          <line x1="395" y1="480" x2="250" y2="320" stroke="#FFFFFF" stroke-width="8" />
          <line x1="395" y1="480" x2="330" y2="290" stroke="#FFFFFF" stroke-width="6" />
          <line x1="395" y1="480" x2="410" y2="280" stroke="#FFFFFF" stroke-width="7" />
          <line x1="395" y1="480" x2="490" y2="300" stroke="#FFFFFF" stroke-width="5" />
        </g>

        <!-- Friendly Friend Silhouette (Awake / Smiling / Greeting) -->
        <g transform="translate(395, 515)" opacity="0.95">
          <!-- Head / Hair -->
          <circle cx="0" cy="-40" r="46" fill="#FFFBEB" />
          <!-- Hair tuft -->
          <path d="M -46 -40 C -46 -85, 46 -85, 46 -40 C 46 -20, 20 0, 0 0 C -20 0, -46 -20, -46 -40 Z" fill="#92400E" />
          <circle cx="0" cy="-35" r="38" fill="#FEF3C7" />
          <!-- Friendly sparkling eyes -->
          <circle cx="-14" cy="-36" r="4.5" fill="#78350F" />
          <circle cx="14" cy="-36" r="4.5" fill="#78350F" />
          <circle cx="-12.5" cy="-38" r="1.5" fill="#FFFFFF" />
          <circle cx="15.5" cy="-38" r="1.5" fill="#FFFFFF" />
          <!-- Cheerful warm smile -->
          <path d="M -12 -20 Q 0 -10 12 -20" fill="none" stroke="#78350F" stroke-width="3.5" stroke-linecap="round" />
          <!-- Blush cheeks -->
          <circle cx="-22" cy="-24" r="5" fill="#F87171" opacity="0.6" />
          <circle cx="22" cy="-24" r="5" fill="#F87171" opacity="0.6" />
          <!-- Shoulders -->
          <path d="M -65 60 C -60 15, 60 15, 65 60 Z" fill="#F97316" />
        </g>
      </g>

      <!-- Glass Highlight Edge -->
      <circle cx="395" cy="480" r="189" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.45" />

      <!-- Golden Sun Status Badge (Day Indicator) -->
      <g transform="translate(285, 370)">
        <circle cx="0" cy="0" r="28" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
        <!-- Sun center -->
        <circle cx="0" cy="0" r="12" fill="#F59E0B" />
        <!-- Sun rays -->
        <line x1="0" y1="-18" x2="0" y2="-15" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="15" x2="0" y2="18" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
        <line x1="-18" y1="0" x2="-15" y2="0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
        <line x1="15" y1="0" x2="18" y2="0" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
        <line x1="-13" y1="-13" x2="-11" y2="-11" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
        <line x1="11" y1="11" x2="13" y2="13" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
        <line x1="13" y1="-13" x2="11" y2="-11" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
        <line x1="-11" y1="11" x2="-13" y2="13" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- ==================== Bottom Greeting Ribbon ==================== -->
    <g transform="translate(512, 790)">
      <rect x="-88" y="-16" width="176" height="32" rx="16" fill="#0F172A" fill-opacity="0.85" />
      <rect x="-88" y="-16" width="176" height="32" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">TIMEFOLK</text>
    </g>

    <!-- Top Diagonal Glass Reflection -->
    <path d="M 92 92 L 650 92 L 250 932 L 92 932 Z" fill="url(#canvasHighlight)" opacity="0.3" pointer-events="none" />

  </g>
</svg>
