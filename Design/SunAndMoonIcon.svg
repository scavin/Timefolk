<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS App Icon Drop Shadow -->
    <filter id="macAppShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.16" />
    </filter>

    <!-- Warm Soft Glow -->
    <filter id="softAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Canvas Day-to-Night Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="35%" stop-color="#F472B6" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Top Specular Highlight on Canvas -->
    <linearGradient id="canvasHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sun Buddy Golden Radiant Gradient -->
    <radialGradient id="sunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>

    <!-- Moon Buddy Gentle Starlight Gradient -->
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </radialGradient>

    <!-- Glowing Time Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="92" y="92" width="840" height="840" rx="200" ry="200" />
    </clipPath>
  </defs>

  <!-- ==================== macOS Squircle Canvas ==================== -->
  <g filter="url(#macAppShadow)">
    <rect x="92" y="92" width="840" height="840" rx="200" ry="200" fill="url(#skyGrad)" />
    <rect x="92" y="92" width="840" height="840" rx="200" ry="200" fill="url(#canvasHighlight)" />
    <rect x="92.5" y="92.5" width="839" height="839" rx="199.5" ry="199.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
  </g>

  <!-- ==================== Content ==================== -->
  <g clip-path="url(#squircleClip)">

    <!-- Twinkling stars in the night sky (right side) -->
    <circle cx="680" cy="220" r="3.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="810" cy="270" r="2.5" fill="#E0E7FF" opacity="0.8" />
    <circle cx="750" cy="360" r="3" fill="#FFFFFF" opacity="0.85" />
    <circle cx="840" cy="460" r="2" fill="#E0E7FF" opacity="0.75" />
    <circle cx="700" cy="480" r="2.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="790" cy="620" r="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Ambient Glow behind characters -->
    <circle cx="390" cy="520" r="220" fill="#FBBF24" opacity="0.25" filter="url(#softAura)" />
    <circle cx="640" cy="520" r="200" fill="#818CF8" opacity="0.3" filter="url(#softAura)" />

    <!-- Glowing Timezone Ribbon Bridge connecting Sun and Moon -->
    <path d="M 390 620 C 450 720, 580 720, 640 620" fill="none" stroke="url(#ribbonGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85" />
    <path d="M 390 620 C 450 720, 580 720, 640 620" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 14" opacity="0.9" />

    <!-- ==================== CUTE SUN BUDDY (Left Side) ==================== -->
    <g transform="translate(390, 510)">
      <!-- Sun Rays (Soft cute rounded scallops) -->
      <g opacity="0.9">
        <circle cx="0" cy="-160" r="20" fill="#F59E0B" />
        <circle cx="113" cy="-113" r="20" fill="#F59E0B" />
        <circle cx="160" cy="0" r="20" fill="#F59E0B" />
        <circle cx="113" cy="113" r="20" fill="#F59E0B" />
        <circle cx="0" cy="160" r="20" fill="#F59E0B" />
        <circle cx="-113" cy="113" r="20" fill="#F59E0B" />
        <circle cx="-160" cy="0" r="20" fill="#F59E0B" />
        <circle cx="-113" cy="-113" r="20" fill="#F59E0B" />
      </g>

      <!-- Sun Main Body -->
      <circle cx="0" cy="0" r="145" fill="url(#sunGrad)" />
      <!-- Subtle top inner highlight -->
      <circle cx="0" cy="0" r="144" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />

      <!-- Cute Happy Eyes (Closed crescent smile ^ ^) -->
      <path d="M -60 -10 Q -42 -38 -24 -10" fill="none" stroke="#78350F" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 24 -10 Q 42 -38 60 -10" fill="none" stroke="#78350F" stroke-width="6.5" stroke-linecap="round" />

      <!-- Sweet Happy Smile -->
      <path d="M -26 24 Q 0 54 26 24" fill="none" stroke="#78350F" stroke-width="6.5" stroke-linecap="round" />

      <!-- Rosy Cheeks -->
      <circle cx="-62" cy="18" r="16" fill="#EF4444" opacity="0.4" />
      <circle cx="62" cy="18" r="16" fill="#EF4444" opacity="0.4" />
    </g>

    <!-- ==================== CUTE MOON BUDDY (Right Side) ==================== -->
    <g transform="translate(635, 515)">
      <!-- Crescent Moon Body -->
      <path d="M 40 -135 C -65 -135, -135 -60, -135 45 C -135 130, -70 190, 15 190 C -45 155, -60 70, -20 -15 C 5 -75, 45 -115, 75 -125 C 63.5 -132, 51.5 -135, 40 -135 Z" fill="url(#moonGrad)" />
      
      <!-- Moon outline / edge highlight -->
      <path d="M 40 -135 C -65 -135, -135 -60, -135 45 C -135 130, -70 190, 15 190 C -45 155, -60 70, -20 -15 C 5 -75, 45 -115, 75 -125 C 63.5 -132, 51.5 -135, 40 -135 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" />

      <!-- Cute Sleeping Eye (- - peacefully resting) -->
      <path d="M -85 25 Q -68 40 -50 25" fill="none" stroke="#312E81" stroke-width="5.5" stroke-linecap="round" />

      <!-- Sweet peaceful sleeping smile -->
      <path d="M -75 62 Q -60 78 -45 62" fill="none" stroke="#312E81" stroke-width="5" stroke-linecap="round" />

      <!-- Shy Rosy Cheek -->
      <circle cx="-85" cy="50" r="13" fill="#EC4899" opacity="0.35" />

      <!-- Cute Nightcap Hat on the Moon's tip -->
      <g transform="translate(48, -132) rotate(25)">
        <!-- Nightcap cone -->
        <path d="M -18 10 Q 0 -55 45 -50 Q 55 5 18 10 Z" fill="#6366F1" />
        <!-- Nightcap brim -->
        <ellipse cx="0" cy="10" rx="22" ry="7" fill="#FFFFFF" />
        <!-- Pom-pom on tip -->
        <circle cx="50" cy="-48" r="9" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Bottom Pill Badge "TIMEFOLK" -->
    <g transform="translate(512, 805)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0F172A" fill-opacity="0.75" />
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.2">TIMEFOLK</text>
    </g>

    <!-- Top Diagonal Glass Reflection -->
    <path d="M 92 92 L 650 92 L 250 932 L 92 932 Z" fill="url(#canvasHighlight)" opacity="0.3" pointer-events="none" />

  </g>
</svg>
